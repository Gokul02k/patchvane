# Patchvane on Render's free plan, which is the one host left that does not
# ask for a card.
#
# Point Render at this file (Blueprint) rather than filling the form in by
# hand, and it asks only for the three values it cannot guess.

services:
  - type: web
    name: patchvane
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    # A push to main is a deploy.
    autoDeploy: true
    # No healthCheckPath on purpose.  Cloud mode answers a plain HTTP request
    # with a redirect to HTTPS, and Render's health check does not send the
    # forwarded-protocol header that would tell it otherwise, so a check here
    # would fail a service that is working perfectly well.  Render watches
    # the port instead.
    envVars:
      # Signs session cookies and seals the vaults.  Set it once and keep it:
      # change it and every stored key becomes unreadable.
      - key: PATCHVANE_SECRET
        sync: false
      # yourname/patchvane-data, the private repository the data lives in.
      - key: PATCHVANE_DATA_REPO
        sync: false
      # The deploy key for that repository, base64 on one line.
      - key: PATCHVANE_DATA_KEY
        sync: false
      # Signing up means reading a six digit code sent to your own address,
      # so the service has to be able to send one.  Render blocks outbound
      # SMTP on free plans, so this goes over HTTPS: deploy/gmail-relay.gs is
      # an Apps Script web app that sends through your own Gmail, which
      # costs nothing and, because the mail really is from you, is not the
      # shape a spam filter is looking for.  Its /exec address:
      - key: PATCHVANE_GAS_URL
        sync: false
      # The secret that script and this service share, so that holding the
      # URL is not enough to send mail as you.
      - key: PATCHVANE_GAS_SECRET
        sync: false
      # Where the link in the welcome mail points, e.g.
      # https://patchvane.onrender.com -- no trailing slash.
      - key: PATCHVANE_URL
        sync: false
      # Settings > Support. Without these the tab still answers questions but
      # has nowhere to send a report, and says so. The token needs nothing
      # beyond issues:write on the one repository named here.
      - key: PATCHVANE_GITHUB_REPO
        sync: false
      - key: PATCHVANE_GITHUB_TOKEN
        sync: false
      # Where ordinary feedback goes, as opposed to bugs.
      - key: PATCHVANE_FEEDBACK_EMAIL
        sync: false
      # The free plan has no disk that survives anything, and Render restarts
      # free services whenever it likes, so snapshot more often than the
      # ten-minute default.
      - key: PATCHVANE_SNAPSHOT_MINUTES
        value: "5"
