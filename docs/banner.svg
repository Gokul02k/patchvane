<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360"
     role="img" aria-label="Patchvane &#8212; an upstream patch tracker">
  <title>Patchvane &#8212; an upstream patch tracker</title>
  <desc>A patch travelling from the mailing list to Linus' tree.</desc>

  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c8dff"/><stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>

    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cb0ff"/>
      <stop offset=".45" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>

    <!-- a highlight that sweeps across the wordmark -->
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-1 0; 1 0; 1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="rail" gradientUnits="userSpaceOnUse"
                    x1="110" y1="0" x2="1090" y2="0">
      <stop offset="0" stop-color="#4c8dff"/>
      <stop offset=".35" stop-color="#e3a008"/>
      <stop offset=".7" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>

    <radialGradient id="glowL" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#4c8dff" stop-opacity=".30"/>
      <stop offset="1" stop-color="#4c8dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity=".24"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#1b2331" stroke-width="1"/>
    </pattern>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <clipPath id="card"><rect width="1200" height="360" rx="20"/></clipPath>

    <style>
      .t { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto,
                       Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo,
                           Consolas, monospace; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="360" fill="#0a0d14"/>
    <rect width="1200" height="360" fill="url(#grid)" opacity=".55"/>
    <ellipse cx="180" cy="90" rx="440" ry="300" fill="url(#glowL)"/>
    <ellipse cx="1080" cy="300" rx="420" ry="280" fill="url(#glowR)"/>

    <!-- ========================================================== the mark -->
    <g transform="translate(64 54) scale(0.63)">
      <rect width="128" height="128" rx="34" fill="url(#face)"/>
      <path d="M26 94h76" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".95"/>
      <path d="M44 94c0-29 16-38 41-38" stroke="#dce9ff" stroke-width="10"
            stroke-linecap="round" fill="none" stroke-dasharray="86"
            stroke-dashoffset="86">
        <animate attributeName="stroke-dashoffset" values="86;0;0;86"
                 keyTimes="0;.35;.85;1" dur="6s" repeatCount="indefinite"/>
      </path>
      <circle cx="93" cy="40" r="15" fill="#fff" opacity=".35" filter="url(#soft)">
        <animate attributeName="opacity" values=".15;.55;.15" dur="6s"
                 repeatCount="indefinite"/>
      </circle>
      <circle cx="93" cy="40" r="12" fill="#fff"/>
    </g>

    <!-- ======================================================= the wordmark -->
    <text class="t" x="164" y="108" font-size="62" font-weight="700"
          letter-spacing="-1.6" fill="url(#word)">Patchvane</text>
    <text class="t" x="164" y="108" font-size="62" font-weight="700"
          letter-spacing="-1.6" fill="url(#sweep)">Patchvane</text>

    <text class="t" x="167" y="143" font-size="19" font-weight="500" fill="#9aa7bd">
      every patch you posted, from the mailing list to Linus' tree
    </text>

    <!-- badges along the top right -->
    <g class="t" font-size="13" font-weight="600">
      <g transform="translate(864 58)">
        <rect width="132" height="30" rx="15" fill="#12161f" stroke="#2e3849"/>
        <circle cx="19" cy="15" r="4" fill="#3fb950">
          <animate attributeName="opacity" values="1;.25;1" dur="2.4s" repeatCount="indefinite"/>
        </circle>
        <text x="32" y="20" fill="#9aa7bd">stdlib only</text>
      </g>
      <g transform="translate(1008 58)">
        <rect width="128" height="30" rx="15" fill="#12161f" stroke="#2e3849"/>
        <circle cx="19" cy="15" r="4" fill="#4c8dff">
          <animate attributeName="opacity" values="1;.25;1" dur="2.4s" begin="1.2s"
                   repeatCount="indefinite"/>
        </circle>
        <text x="32" y="20" fill="#9aa7bd">no database</text>
      </g>
    </g>

    <!-- ======================================================== the journey -->
    <g transform="translate(0 232)">
      <line x1="110" y1="0" x2="1090" y2="0" stroke="#232b39" stroke-width="3"
            stroke-linecap="round"/>
      <line x1="110" y1="0" x2="1090" y2="0" stroke="url(#rail)" stroke-width="3"
            stroke-linecap="round" stroke-dasharray="980" stroke-dashoffset="980">
        <animate attributeName="stroke-dashoffset" values="980;0;0" keyTimes="0;.75;1"
                 dur="9s" repeatCount="indefinite"/>
      </line>

      <!-- the five stops -->
      <g>
        <circle cx="110"  cy="0" r="8" fill="#0a0d14" stroke="#4c8dff" stroke-width="3"/>
        <circle cx="355"  cy="0" r="8" fill="#0a0d14" stroke="#e3a008" stroke-width="3"/>
        <circle cx="600"  cy="0" r="8" fill="#0a0d14" stroke="#a371f7" stroke-width="3"/>
        <circle cx="845"  cy="0" r="8" fill="#0a0d14" stroke="#2dd4bf" stroke-width="3"/>
        <circle cx="1090" cy="0" r="9" fill="#0a0d14" stroke="#3fb950" stroke-width="3"/>
        <circle cx="1090" cy="0" r="9" fill="#3fb950" opacity="0">
          <animate attributeName="opacity" values="0;0;.9;0" keyTimes="0;.72;.82;1"
                   dur="9s" repeatCount="indefinite"/>
          <animate attributeName="r" values="9;9;22;9" keyTimes="0;.72;.82;1"
                   dur="9s" repeatCount="indefinite"/>
        </circle>
      </g>

      <!-- patches making the trip, one behind the other -->
      <g>
        <circle cy="0" r="6" fill="#7cb0ff">
          <animate attributeName="cx"
                   values="110;355;355;600;600;845;845;1090;1090"
                   keyTimes="0;.16;.24;.40;.48;.62;.70;.86;1"
                   dur="9s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.04;.88;.96"
                   dur="9s" repeatCount="indefinite"/>
          <animate attributeName="fill" values="#7cb0ff;#e3a008;#a371f7;#2dd4bf;#3fb950"
                   keyTimes="0;.24;.48;.70;.88" dur="9s" repeatCount="indefinite"/>
        </circle>
        <circle cy="0" r="5" fill="#7cb0ff" opacity="0">
          <animate attributeName="cx"
                   values="110;355;355;600;600;845;845;1090;1090"
                   keyTimes="0;.16;.24;.40;.48;.62;.70;.86;1"
                   dur="9s" begin="3s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;.85;.85;0" keyTimes="0;.04;.88;.96"
                   dur="9s" begin="3s" repeatCount="indefinite"/>
        </circle>
        <circle cy="0" r="4" fill="#7cb0ff" opacity="0">
          <animate attributeName="cx"
                   values="110;355;355;600;600;845;845;1090;1090"
                   keyTimes="0;.16;.24;.40;.48;.62;.70;.86;1"
                   dur="9s" begin="6s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;.6;.6;0" keyTimes="0;.04;.88;.96"
                   dur="9s" begin="6s" repeatCount="indefinite"/>
        </circle>
      </g>

      <g class="mono" font-size="14" fill="#66738a" text-anchor="middle">
        <text x="110"  y="34">posted</text>
        <text x="355"  y="34">reviewed</text>
        <text x="600"  y="34">accepted</text>
        <text x="845"  y="34">linux-next</text>
        <text x="1090" y="34" fill="#3fb950" font-weight="600">mainline</text>
      </g>
    </g>

    <text class="mono" x="600" y="332" font-size="13.5" fill="#66738a" text-anchor="middle">
      ./run.sh &#8594; http://127.0.0.1:8787
    </text>

    <rect width="1200" height="360" rx="20" fill="none" stroke="#232b39" stroke-width="2"/>
  </g>
</svg>
